name: PlatformIO CI

on:
  push:
  pull_request:

jobs:
  platformio:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: python -m pip install platformio

      - name: Run native test suite
        run: python -m platformio test -e native

      - name: Build production firmware
        run: python -m platformio run -e production

      - name: Build development firmware
        run: python -m platformio run -e esp32doit-devkit-v1
