; ===========================================================================
; PlatformIO Project Configuration File — Fortico ESP32
; ===========================================================================

[platformio]
default_envs = esp32doit-devkit-v1

; ---------------------------------------------------------------------------
; Configuration commune
; ---------------------------------------------------------------------------
[common]
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror

; ---------------------------------------------------------------------------
; ESP32 — Firmware production
; ---------------------------------------------------------------------------
[env:esp32doit-devkit-v1]
platform    = espressif32
board       = esp32doit-devkit-v1
framework   = arduino
board_build.partitions = partitions.csv
lib_deps =
    adafruit/Adafruit PN532
    knolleary/PubSubClient
build_flags =
    ${common.build_flags}
    -DESP32_TARGET

monitor_speed = 115200

extra_scripts = pre:tools/platformio_certificate_target.py

; Compile TOUT src/ pour ESP32
build_src_filter = 
    +<*>

; Profil de release : la vérification au démarrage exige Secure Boot et
; Flash Encryption actifs sur la cible. Aucun eFuse n'est programmé par PIO.
[env:production]
extends = env:esp32doit-devkit-v1
build_flags =
    ${env:esp32doit-devkit-v1.build_flags}
    -DFORTICO_PRODUCTION_BUILD

; ---------------------------------------------------------------------------
; Natif PC — Tests unitaires
; ---------------------------------------------------------------------------
[env:native]
platform    = native
test_framework = unity
test_filter = test_*
test_build_src = yes
build_flags =
    ${common.build_flags}
    -DNATIVE_TEST
    -DFORTICO_PRODUCTION_BUILD

; Compile uniquement le code natif nécessaire aux tests (pas de main Arduino,
; de setup()/loop(), ni de composants matériels/FreeRTOS).
build_src_filter =
    +<utils/timer_utils.cpp>
    +<services/security/security_service.cpp>
    +<services/security/provisioning_service.cpp>
    +<services/security/ota_key_store.cpp>
    +<managers/ota_manager/ota_manager.cpp>