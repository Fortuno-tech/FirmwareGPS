; ===========================================================================
; PlatformIO Project Configuration File — Fortico ESP32
; ===========================================================================

[platformio]
default_envs = esp32doit-devkit-v1

; ---------------------------------------------------------------------------
; Configuration commune
; ---------------------------------------------------------------------------
[common]
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror

; ---------------------------------------------------------------------------
; ESP32 — Firmware production
; ---------------------------------------------------------------------------
[env:esp32doit-devkit-v1]
platform    = espressif32
board       = esp32doit-devkit-v1
framework   = arduino
board_build.partitions = partitions.csv
lib_deps =
    adafruit/Adafruit PN532
    knolleary/PubSubClient
build_flags =
    ${common.build_flags}
    -DESP32_TARGET

monitor_speed = 115200

; Cible manuelle : pio run -e esp32doit-devkit-v1 -t upload_certificate --upload-port COM5
; Le port doit Ãªtre reliÃ© directement au SIM7600, pas au moniteur sÃ©rie ESP32.
extra_scripts = pre:tools/platformio_certificate_target.py

; Compile TOUT src/ pour ESP32
build_src_filter = 
    +<*>

; ---------------------------------------------------------------------------
; Natif PC — Tests unitaires
; ---------------------------------------------------------------------------
[env:native]
platform    = native
test_filter = test_*
test_build_src = yes
build_flags =
    ${common.build_flags}
    -DNATIVE_TEST
    -Iinclude
    -Itest

build_src_filter =
    +<utils/timer_utils.cpp>
    +<services/security/security_service.cpp>
    +<services/security/provisioning_service.cpp>
    +<services/security/ota_key_store.cpp>
    
