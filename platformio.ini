; ===========================================================================
; PlatformIO Project Configuration File — Fortico ESP32
; ===========================================================================

; ---------------------------------------------------------------------------
; Configuration commune
; ---------------------------------------------------------------------------
[common]
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror

; ---------------------------------------------------------------------------
; ESP32 — Firmware production
; ---------------------------------------------------------------------------
[env:esp32doit-devkit-v1]
platform    = espressif32
board       = esp32doit-devkit-v1
framework   = arduino
board_build.partitions = partitions.csv
build_flags =
    ${common.build_flags}
    -DESP32_TARGET

monitor_speed = 115200

; Compile TOUT src/ pour ESP32
build_src_filter = 
    +<*>

; ---------------------------------------------------------------------------
; Natif PC — Tests unitaires
; ---------------------------------------------------------------------------
[env:native]
platform    = native
test_filter = test_timer
build_flags =
    ${common.build_flags}
    -DNATIVE_TEST

; ⚠️ IMPORTANT : Exclure les fichiers dépendants d'Arduino/FreeRTOS
build_src_filter =
    +<*>                              ; Inclure par défaut
    -<main.cpp>                       ; Exclure main Arduino
    -<core/event_bus/>                ; Exclure event_bus (FreeRTOS)
    -<core/logger/>                   ; Exclure logger (FreeRTOS)
    -<core/memory/>                   ; Exclure si dépend de FreeRTOS
    -<core/power/>                    ; Exclure si dépend de FreeRTOS
    -<hardware/>                      ; Exclure tout hardware ESP32
    -<tasks/>                         ; Exclure tâches FreeRTOS
    -<core/watchdog/>
    
